<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f7f5" />
      <stop offset="100%" stop-color="#e3e9e5" />
    </linearGradient>
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6b4f" />
      <stop offset="100%" stop-color="#154d39" />
    </linearGradient>
    <linearGradient id="coffeeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a06325" />
      <stop offset="100%" stop-color="#7a4e09" />
    </linearGradient>
  </defs>

  <!-- Latar Belakang -->
  <rect width="600" height="600" fill="url(#bgGrad)" />

  <!-- Lingkaran Dekorasi Lembut -->
  <circle cx="300" cy="270" r="160" fill="#1f6b4f" opacity="0.06" />
  <circle cx="300" cy="270" r="125" fill="#1f6b4f" opacity="0.08" />

  <!-- Ikon Cangkir Kopi Modern -->
  <g transform="translate(0, -10)">
    <!-- Asap Aroma Kopi Halus -->
    <path d="M270 145 Q260 170 270 195 Q280 220 270 240" fill="none" stroke="#a06325" stroke-width="4" stroke-linecap="round" opacity="0.45" />
    <path d="M300 135 Q290 165 300 195 Q310 225 300 245" fill="none" stroke="#1f6b4f" stroke-width="5" stroke-linecap="round" opacity="0.5" />
    <path d="M330 145 Q340 170 330 195 Q320 220 330 240" fill="none" stroke="#a06325" stroke-width="4" stroke-linecap="round" opacity="0.45" />

    <!-- Gagang Cangkir -->
    <path d="M360 270 C410 270 410 335 360 335" fill="none" stroke="url(#cupGrad)" stroke-width="16" stroke-linecap="round" />

    <!-- Badan Cangkir -->
    <path d="M225 255 L245 350 C250 375 270 385 300 385 C330 385 350 375 355 350 L375 255 Z" fill="url(#cupGrad)" />

    <!-- Permukaan Kopi -->
    <ellipse cx="300" cy="255" rx="75" ry="18" fill="url(#coffeeGrad)" />
    <!-- Busa Latte Art Hati Halus -->
    <ellipse cx="300" cy="255" rx="28" ry="7" fill="#fbefd8" opacity="0.8" />

    <!-- Tatakan Piring Cangkir -->
    <ellipse cx="300" cy="385" rx="105" ry="14" fill="#154d39" opacity="0.25" />
    <path d="M195 385 C195 395 240 405 300 405 C360 405 405 395 405 385 Z" fill="url(#cupGrad)" opacity="0.9" />
  </g>

  <!-- Teks Keterangan Foto -->
  <text x="300" y="475" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" fill="#1b2420">
    Foto Belum Tersedia
  </text>
  <text x="300" y="508" text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#5b6a62">
    Narun Artisan Coffee
  </text>
</svg>
